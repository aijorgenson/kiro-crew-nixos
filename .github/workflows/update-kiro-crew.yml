name: Update Kiro Crew

on:
  schedule:
    # Daily at 09:00 UTC. Enough to stay current without a manual pin bump.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-kiro-crew
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Restrict manual runs to repo admins
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          response=$(curl -sSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/collaborators/${ACTOR}/permission")
          permission=$(echo "$response" | jq -r '.permission // "unknown"')
          echo "actor ${ACTOR} has permission: ${permission}"
          if [ "$permission" != "admin" ]; then
            echo "::error::Only repo admins can manually run this workflow (${ACTOR} resolved to '${permission}')."
            echo "API response was: $response"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check for a newer Kiro Crew or Kiro CLI release
        id: check
        run: |
          latest_version=$(curl -fsSL \
            https://updates.crew.kiro.dev/feed/stable/latest-cli.json \
            | jq -r .version)
          latest_cli=$(curl -fsSL \
            https://prod.download.cli.kiro.dev/stable/latest/manifest.json \
            | jq -r .version)
          if [ -z "$latest_version" ] || [ "$latest_version" = "null" ]; then
            echo "::error::Could not resolve the latest Kiro Crew version from the stable feed."
            exit 1
          fi
          if [ -z "$latest_cli" ] || [ "$latest_cli" = "null" ]; then
            echo "::error::Could not resolve the latest Kiro CLI version from the stable manifest."
            exit 1
          fi
          current_version=$(jq -r .version sources.json)
          current_cli=$(jq -r .kiroCli.version sources.json)

          echo "desktop current: ${current_version}, latest: ${latest_version}"
          echo "kiro-cli current: ${current_cli}, latest: ${latest_cli}"
          if [ "$latest_version" = "$current_version" ] && [ "$latest_cli" = "$current_cli" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "version=${latest_version}" >> "$GITHUB_OUTPUT"
            echo "cli_version=${latest_cli}" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version and refresh hashes
        if: steps.check.outputs.updated == 'true'
        run: ./update-package.sh

      - name: Commit and push
        if: steps.check.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources.json
          if git diff --staged --quiet; then
            echo "No changes staged; skipping commit."
            exit 0
          fi
          git commit -m "chore: update kirocrew-desktop to ${{ steps.check.outputs.version }} and kiro-cli to ${{ steps.check.outputs.cli_version }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Tag the release
        if: steps.check.outputs.updated == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          tag="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists on origin; leaving it untouched."
            exit 0
          fi
          git tag "${tag}"
          git push origin "refs/tags/${tag}"
